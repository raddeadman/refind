[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
markers =
    db: needs a running MongoDB replica set (skipped if unreachable)
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince211
    ignore:The httpx module is deprecated
